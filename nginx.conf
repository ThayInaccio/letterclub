# Template: o entrypoint do nginx troca ${API_UPSTREAM} pela variável de ambiente.
# Limite por IP na API. O real_ip abaixo faz o limite valer por pessoa, não pelo IP do proxy de borda.
# Em outra nuvem, troque 0.0.0.0/0 e ::/0 pelos CIDRs do seu load balancer.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
# páginas públicas (crawlers leem muitas seguidas): limite próprio e mais folgado; acima dele, 429 faz o Google desacelerar
limit_req_zone $binary_remote_addr zone=paginas:10m rate=30r/s;

# Railway (e qualquer proxy que ACRESCENTA ao X-Forwarded-For): sem recursão, o nginx usa o último
# endereço da lista, que é o que o proxy de borda viu. O primeiro pode ter sido forjado pelo cliente.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

server {
  listen 8080;
  root /usr/share/nginx/html;
  absolute_redirect off;   # /cartas → /cartas/ sem vazar host/porta interna atrás do load balancer
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml;

  # add_header não herda entre níveis, por isso repetido em cada location
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
  }
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 32k;
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Páginas geradas pela API: cartas, temas, imagens de prévia, sitemaps e moderação
  location ~ ^/(carta|temas|og)(/|$) {
    limit_req zone=paginas burst=60 nodelay;
    limit_req_status 429;
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ~ ^/(sitemap\.xml|sitemap-cartas\.xml|moderar)$ {
    limit_req zone=paginas burst=20 nodelay;
    limit_req_status 429;
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;
  }
  location = /healthz { access_log off; return 200 "ok\n"; }
}
