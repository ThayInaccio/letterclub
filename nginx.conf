# Template: o entrypoint do nginx troca ${API_UPSTREAM} pela variável de ambiente.
# Limite por IP na API. Atrás de load balancer, configure real_ip (set_real_ip_from <CIDR da VPC>;
# real_ip_header X-Forwarded-For;), senão o limite vale para o IP do LB.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 8080;
  root /usr/share/nginx/html;
  absolute_redirect off;   # /cartas → /cartas/ sem vazar host/porta interna atrás do load balancer
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml;

  # add_header não herda entre níveis, por isso repetido em cada location
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
  }
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 32k;
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;
  }
  location = /healthz { access_log off; return 200 "ok\n"; }
}
